<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hover and press</title>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="hover-press.css">
<style>
  body{margin:0;font:16px/1.5 Outfit,system-ui,sans-serif;background:rgb(var(--color-bg));color:rgb(var(--color-ink))}
  main{max-width:880px;margin:0 auto;padding:32px 16px;display:grid;gap:28px}
  h1,h2{margin:0} h2{font-size:1.05rem} p{margin:0;color:rgb(var(--color-muted))}
  section{display:grid;gap:12px} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .btn{font:inherit;padding:8px 16px;min-height:40px;border-radius:999px;border:0;background:rgb(var(--color-accent));color:rgb(var(--color-on-accent));cursor:pointer}
  .btn.ghost{background:transparent;color:rgb(var(--color-ink));border:1px solid rgb(var(--color-outline))}
  .card{background:rgb(var(--color-panel));border:1px solid rgb(var(--color-line));border-radius:16px;padding:16px}
  .stage{position:relative;height:300px;border:1px solid rgb(var(--color-line));border-radius:16px;overflow:hidden;background:rgb(var(--color-surface))}
  .btn:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid rgb(var(--color-focus));outline-offset:2px}
.pad{padding:10px 12px;border-radius:10px}.card.sw-card-hover{max-width:320px}</style>
</head>
<body>
<main>
  <header class="row"><h1>Hover and press</h1>
    <button type="button" class="btn ghost" onclick="document.documentElement.classList.toggle('dark')">Toggle dark</button></header>
  <p>Hover and press (hold the mouse down) each control: only colour changes; buttons sink to 0.98 while pressed. Under <code>prefers-reduced-motion: reduce</code> the motion is removed and the end state shows at once.</p>
<section class="row"><button class="desk-button-primary">Save</button><button class="desk-button">Cancel</button><button class="desk-button-primary" disabled style="opacity:.5">Disabled</button></section>
<section><div class="card sw-card-hover sw-hover"><strong>Card</strong><p>Border colour eases in on hover.</p></div></section>
<section style="max-width:320px"><div class="sw-row-hover sw-hover pad">Row one</div><div class="sw-row-hover sw-hover pad">Row two</div><a href="#" class="sw-link-hover sw-hover" style="color:rgb(var(--color-ink))">Link underline</a></section>
</main>
</body>
</html>
