<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFF4E8">
<title>Theme reveal</title>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="theme-reveal.css">
<script>
  /* No-flash pre-paint script (docs/theming.md): runs before first paint. */
  (function () {
    try {
      var p = localStorage.getItem("makerspace.theme");
      var dark = p === "dark" || (p === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      if (dark) document.documentElement.classList.add("dark");
      var m = document.querySelector('meta[name="theme-color"]');
      if (m && dark) m.setAttribute("content", "#000000");
    } catch (e) {}
  })();
</script>
<style>
  body { margin: 0; font: 16px/1.5 Outfit, system-ui, sans-serif; background: rgb(var(--color-bg)); color: rgb(var(--color-ink)); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px;
           background: rgb(var(--color-surface)); border-bottom: 1px solid rgb(var(--color-line)); }
  header h1 { margin: 0; font-size: 20px; }
  .toggle { width: 44px; height: 44px; border-radius: 999px; cursor: pointer; display: grid; place-items: center;
            background: transparent; color: rgb(var(--color-ink)); border: 1px solid rgb(var(--color-outline)); }
  .toggle:hover { background: rgb(var(--color-hover)); }
  .toggle:focus-visible { outline: 2px solid rgb(var(--color-focus)); outline-offset: 2px; }
  .toggle svg { width: 20px; height: 20px; }
  html.dark .moon, html:not(.dark) .sun { display: none; }
  main { max-width: 880px; margin: 0 auto; padding: 32px 24px; display: grid; gap: 20px; }
  .card { background: rgb(var(--color-panel)); border: 1px solid rgb(var(--color-line)); border-radius: 14px; padding: 20px; }
  .card h2 { margin: 0 0 8px; font-size: 18px; }
  .card p { margin: 0 0 12px; color: rgb(var(--color-muted)); }
  .btn { font: inherit; padding: 8px 18px; border-radius: 999px; border: 0; cursor: pointer;
         background: rgb(var(--color-accent)); color: rgb(var(--color-on-accent)); }
  .seg { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; border: 1px solid rgb(var(--color-line)); }
  .seg button { font: inherit; padding: 6px 14px; border-radius: 999px; border: 0; cursor: pointer; background: transparent; color: inherit; }
  .seg button[aria-pressed="true"] { background: rgb(var(--color-accent-soft)); color: rgb(var(--color-accent-ink)); }
</style>
</head>
<body>
<header>
  <h1>Theme reveal</h1>
  <button class="toggle" id="toggle" type="button" aria-label="Switch theme">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13A8.5 8.5 0 0 1 11 3.5 8.5 8.5 0 1 0 20.5 13Z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
  </button>
</header>
<main>
  <section class="card">
    <h2>Issue the laser cutter</h2>
    <p>Press the round toggle: the new theme grows from it in 720 ms. Under reduced motion the switch is instant.</p>
    <button class="btn" type="button">Issue</button>
  </section>
  <section class="card">
    <h2>Light, Dark or System</h2>
    <p>The same call works for a segmented picker; the circle grows from the button you pressed.</p>
    <div class="seg" role="group" aria-label="Appearance">
      <button type="button" data-mode="light">Light</button>
      <button type="button" data-mode="dark">Dark</button>
      <button type="button" data-mode="system">System</button>
    </div>
  </section>
</main>
<script src="theme-reveal.js"></script>
<script>
  var KEY = "makerspace.theme";
  function pref() { try { var p = localStorage.getItem(KEY); return /^(light|dark|system)$/.test(p) ? p : "light"; } catch (e) { return "light"; } }
  var pickers = document.querySelectorAll("[data-mode]");
  function sync() { pickers.forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.mode === pref())); }); }
  document.getElementById("toggle").onclick = function (e) {
    var dark = document.documentElement.classList.contains("dark");
    SwThemeReveal.switchTheme(dark ? "light" : "dark", e.currentTarget);
    sync();
  };
  pickers.forEach(function (b) { b.onclick = function () { SwThemeReveal.switchTheme(b.dataset.mode, b); sync(); }; });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { if (pref() === "system") SwThemeReveal.applyTheme("system"); });
  sync();
</script>
</body>
</html>
